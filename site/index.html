<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile Renders</title>
<style>
  :root {
    --bg: #0b0b0f;
    --card: #16161d;
    --text: #f2f2f7;
    --dim: #9a9aa5;
    --accent: #8be28b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 10px;
    background: linear-gradient(var(--bg) 75%, transparent);
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  #meta { color: var(--dim); font-size: 12.5px; }
  #chips { display: flex; gap: 8px; padding: 2px 18px 10px; flex-wrap: wrap; }
  .chip {
    border: 1px solid #2c2c36; background: var(--card); color: var(--dim);
    border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  }
  .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  main {
    display: flex; flex-direction: column; align-items: center; gap: 34px;
    padding: 6px 0 60px;
  }
  .shot { width: min(94vw, 430px); }
  .frame {
    position: relative; border-radius: 18px; overflow: hidden; background: var(--card);
    aspect-ratio: 9 / 16; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .frame video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .caption { padding: 12px 6px 0; }
  .caption .title { font-weight: 600; }
  .caption .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .caption .note { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
  #empty {
    max-width: 430px; margin: 12vh auto; padding: 0 24px; color: var(--dim);
    text-align: center;
  }
  #empty code { color: var(--text); background: var(--card); padding: 2px 6px; border-radius: 6px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Mobile renders</h1>
  <span id="meta"></span>
</header>
<div id="chips"></div>
<main id="feed"></main>
<div id="empty" hidden>
  <p>No videos here yet.</p>
  <p>On Aurelius, run <code>site\collect_mobile_renders.ps1</code> — it copies every
  finished vertical render into <code>site/videos/</code> and regenerates the manifest.</p>
</div>
<script>
(async function () {
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  const meta = document.getElementById('meta');
  const chips = document.getElementById('chips');

  let manifest = null;
  try {
    const r = await fetch('videos/manifest.json', { cache: 'no-store' });
    if (r.ok) manifest = await r.json();
  } catch (e) { /* fall through to empty state */ }

  if (!manifest || !manifest.videos || manifest.videos.length === 0) {
    empty.hidden = false;
    return;
  }

  const videos = manifest.videos.slice().sort(
    (a, b) => (b.finished || '').localeCompare(a.finished || ''));
  if (manifest.generated) {
    meta.textContent = videos.length + ' videos · updated ' + manifest.generated.slice(0, 10);
  }

  const projects = [...new Set(videos.map(v => v.project).filter(Boolean))];
  let active = null;
  if (projects.length > 1) {
    const all = document.createElement('button');
    all.className = 'chip on'; all.textContent = 'all';
    chips.appendChild(all);
    for (const p of projects) {
      const c = document.createElement('button');
      c.className = 'chip'; c.textContent = p;
      chips.appendChild(c);
    }
    chips.addEventListener('click', e => {
      const c = e.target.closest('.chip'); if (!c) return;
      chips.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      c.classList.add('on');
      active = c === all ? null : c.textContent;
      render();
    });
  }

  function render() {
    feed.textContent = '';
    for (const v of videos) {
      if (active && v.project !== active) continue;
      const el = document.createElement('section');
      el.className = 'shot';
      const when = v.finished ? new Date(v.finished).toLocaleDateString(undefined,
        { month: 'short', day: 'numeric' }) : '';
      el.innerHTML =
        '<div class="frame"><video playsinline muted loop preload="metadata" controls></video></div>' +
        '<div class="caption"><div class="title"></div><div class="sub"></div>' +
        (v.note ? '<div class="note"></div>' : '') + '</div>';
      el.querySelector('video').src = 'videos/' + encodeURIComponent(v.file);
      el.querySelector('.title').textContent = v.name || v.file;
      el.querySelector('.sub').textContent =
        [v.project, v.res, when].filter(Boolean).join(' · ');
      if (v.note) el.querySelector('.note').textContent = v.note;
      feed.appendChild(el);
    }
  }
  render();

  // Autoplay whichever video is mostly on screen; pause the rest.
  const io = new IntersectionObserver(entries => {
    for (const en of entries) {
      const vid = en.target;
      if (en.intersectionRatio >= 0.6) vid.play().catch(() => {});
      else vid.pause();
    }
  }, { threshold: [0, 0.6] });
  new MutationObserver(() =>
    feed.querySelectorAll('video').forEach(v => io.observe(v))
  ).observe(feed, { childList: true, subtree: true });
  feed.querySelectorAll('video').forEach(v => io.observe(v));
})();
</script>
</body>
</html>
