<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile Renders</title>
<style>
  :root {
    --bg: #0b0b0f;
    --card: #16161d;
    --text: #f2f2f7;
    --dim: #9a9aa5;
    --accent: #8be28b;
    --danger: #ff5a5a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 4px;
    background: linear-gradient(var(--bg) 75%, transparent);
  }
  .titlerow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  #meta { color: var(--dim); font-size: 12.5px; }
  #editToggle {
    margin-left: auto; border: 1px solid #2c2c36; background: var(--card);
    color: var(--dim); border-radius: 999px; padding: 5px 13px; font-size: 13px;
    cursor: pointer;
  }
  body.editing #editToggle { color: var(--bg); background: var(--danger); border-color: var(--danger); }
  #chips { display: flex; gap: 8px; padding: 8px 18px 10px; flex-wrap: wrap; }
  .chip {
    border: 1px solid #2c2c36; background: var(--card); color: var(--dim);
    border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  }
  .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  .chip.reset { color: var(--danger); border-color: #3a2530; }
  main {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px 14px;
    width: min(96vw, 760px);
    margin: 0 auto;
    padding: 6px 0 60px;
  }
  h2.section {
    grid-column: 1 / -1; margin: 16px 0 0; font-size: 13px;
    text-transform: uppercase; letter-spacing: .12em; color: var(--dim);
    border-bottom: 1px solid #24242e; padding-bottom: 6px;
  }
  .shot { width: 100%; min-width: 0; position: relative; }
  .frame {
    position: relative; border-radius: 16px; overflow: hidden; background: #000;
    aspect-ratio: 9 / 16; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .frame video, .frame iframe {
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: #000; border: 0;
  }
  .del {
    position: absolute; top: 8px; right: 8px; z-index: 6;
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: var(--danger); color: #fff; font-size: 17px; line-height: 1;
    cursor: pointer; display: none; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  body.editing .del { display: flex; }
  .caption { padding: 10px 4px 0; display: flex; justify-content: space-between;
    align-items: baseline; gap: 8px; }
  .caption .title { font-weight: 600; font-size: 14px; }
  .caption .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .caption a { color: var(--accent); font-size: 12px; text-decoration: none; white-space: nowrap; }
  #empty {
    grid-column: 1 / -1; max-width: 430px; margin: 12vh auto; padding: 0 24px;
    color: var(--dim); text-align: center;
  }
  #empty code { color: var(--text); background: var(--card); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>Mobile renders</h1><span id="meta"></span>
    <button id="editToggle" hidden>Edit</button>
  </div>
  <div id="chips"></div>
</header>
<main id="feed"></main>
<script>
(async function () {
  const feed = document.getElementById('feed');
  const chips = document.getElementById('chips');
  const editToggle = document.getElementById('editToggle');

  // Per-device hidden list. localStorage can throw (private mode) — guard it.
  const HKEY = 'hiddenRenders';
  function loadHidden() {
    try { return new Set(JSON.parse(localStorage.getItem(HKEY) || '[]')); }
    catch (e) { return new Set(); }
  }
  function saveHidden(set) {
    try { localStorage.setItem(HKEY, JSON.stringify([...set])); } catch (e) {}
  }
  let hidden = loadHidden();

  async function getJSON(path) {
    try { const r = await fetch(path, { cache: 'no-store' }); return r.ok ? await r.json() : null; }
    catch (e) { return null; }
  }
  const [manifest, drive] = await Promise.all(
    [getJSON('videos/manifest.json'), getJSON('videos/drive.json')]);

  const sections = [];
  if (manifest && manifest.videos && manifest.videos.length) {
    const vids = manifest.videos.slice().sort(
      (a, b) => (b.finished || '').localeCompare(a.finished || ''));
    sections.push({ name: 'Fresh from the render queue', cards: vids.map(v => ({
      key: 'local:' + v.file, kind: 'local', file: v.file, title: v.name || v.file,
      sub: [v.project, v.res, v.finished && v.finished.slice(0, 10)].filter(Boolean).join(' · '),
    })) });
  }
  if (drive && drive.sections) {
    for (const s of drive.sections) {
      sections.push({ name: s.name, cards: s.entries.map(e => ({
        key: 'drive:' + e.id, kind: 'drive', id: e.id, title: e.title,
        sub: [e.year, e.note].filter(Boolean).join(' · '),
      })) });
    }
  }

  const totalAll = sections.reduce((n, s) => n + s.cards.length, 0);
  if (!totalAll) {
    const d = document.createElement('div');
    d.id = 'empty';
    d.innerHTML = '<p>Nothing to show yet.</p><p>Archive renders load from ' +
      '<code>videos/drive.json</code>; queue renders appear after running ' +
      '<code>site\\collect_mobile_renders.ps1</code> on Aurelius.</p>';
    feed.appendChild(d);
    return;
  }
  editToggle.hidden = false;

  let active = null;
  function shown(s) { return s.cards.filter(c => !hidden.has(c.key)); }

  function buildChips() {
    chips.textContent = '';
    const allChip = document.createElement('button');
    allChip.className = 'chip' + (active === null ? ' on' : '');
    allChip.textContent = 'all'; allChip._val = null;
    chips.appendChild(allChip);
    for (const s of sections) {
      if (!shown(s).length) continue;
      const c = document.createElement('button');
      c.className = 'chip' + (active === s.name ? ' on' : '');
      c.textContent = s.name; c._val = s.name;
      chips.appendChild(c);
    }
    if (hidden.size) {
      const r = document.createElement('button');
      r.className = 'chip reset';
      r.textContent = 'Restore ' + hidden.size + ' hidden';
      r._reset = true;
      chips.appendChild(r);
    }
  }
  chips.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    if (c._reset) { hidden = new Set(); saveHidden(hidden); render(); return; }
    active = c._val;
    render();
  });

  editToggle.addEventListener('click', () => document.body.classList.toggle('editing'));

  const lazyIO = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.isIntersecting && en.target.dataset.src) {
        en.target.src = en.target.dataset.src;
        delete en.target.dataset.src;
        lazyIO.unobserve(en.target);
      }
    }
  }, { rootMargin: '600px' });
  const playIO = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.intersectionRatio >= 0.6) en.target.play().catch(() => {});
      else en.target.pause();
    }
  }, { threshold: [0, 0.6] });

  function makeCard(card) {
    const el = document.createElement('section');
    el.className = 'shot';

    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕';
    del.title = 'Hide this render';
    del.setAttribute('aria-label', 'Hide ' + card.title);
    del.addEventListener('click', () => {
      hidden.add(card.key); saveHidden(hidden); render();
    });
    el.appendChild(del);

    const frame = document.createElement('div');
    frame.className = 'frame';
    let link = '';
    if (card.kind === 'local') {
      const v = document.createElement('video');
      v.playsInline = true; v.muted = true; v.loop = true;
      v.preload = 'metadata'; v.controls = true;
      v.src = 'videos/' + encodeURIComponent(card.file);
      frame.appendChild(v);
      playIO.observe(v);
    } else {
      const f = document.createElement('iframe');
      f.dataset.src = 'https://drive.google.com/file/d/' + card.id + '/preview';
      f.allow = 'autoplay; fullscreen'; f.loading = 'lazy';
      frame.appendChild(f);
      lazyIO.observe(f);
      link = 'https://drive.google.com/file/d/' + card.id + '/view';
    }
    el.appendChild(frame);

    const cap = document.createElement('div');
    cap.className = 'caption';
    cap.innerHTML = '<div><div class="title"></div><div class="sub"></div></div>' +
      (link ? '<a target="_blank" rel="noopener">Drive ↗</a>' : '');
    cap.querySelector('.title').textContent = card.title;
    cap.querySelector('.sub').textContent = card.sub;
    if (link) cap.querySelector('a').href = link;
    el.appendChild(cap);
    return el;
  }

  function render() {
    buildChips();
    feed.textContent = '';
    let anyShown = 0;
    for (const s of sections) {
      if (active && s.name !== active) continue;
      const cards = shown(s);
      if (!cards.length) continue;
      const h = document.createElement('h2');
      h.className = 'section'; h.textContent = s.name;
      feed.appendChild(h);
      for (const card of cards) { feed.appendChild(makeCard(card)); anyShown++; }
    }
    const visible = sections.reduce((n, s) => n + shown(s).length, 0);
    document.getElementById('meta').textContent =
      visible + ' renders' + (hidden.size ? ' · ' + hidden.size + ' hidden' : '');
  }
  render();
})();
</script>
</body>
</html>
