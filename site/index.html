<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobile Renders</title>
<style>
  :root {
    --bg: #0b0b0f;
    --card: #16161d;
    --text: #f2f2f7;
    --dim: #9a9aa5;
    --accent: #8be28b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header {
    position: sticky; top: 0; z-index: 10;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 4px;
    background: linear-gradient(var(--bg) 75%, transparent);
  }
  h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: .02em; display: inline; }
  #meta { color: var(--dim); font-size: 12.5px; margin-left: 10px; }
  #chips { display: flex; gap: 8px; padding: 8px 18px 10px; flex-wrap: wrap; }
  .chip {
    border: 1px solid #2c2c36; background: var(--card); color: var(--dim);
    border-radius: 999px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  }
  .chip.on { color: var(--bg); background: var(--accent); border-color: var(--accent); }
  main {
    display: flex; flex-direction: column; align-items: center; gap: 34px;
    padding: 6px 0 60px;
  }
  h2.section {
    width: min(94vw, 430px); margin: 14px 0 -18px; font-size: 13px;
    text-transform: uppercase; letter-spacing: .12em; color: var(--dim);
    border-bottom: 1px solid #24242e; padding-bottom: 6px;
  }
  .shot { width: min(94vw, 430px); }
  .frame {
    position: relative; border-radius: 18px; overflow: hidden; background: #000;
    aspect-ratio: 9 / 16; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .frame video, .frame iframe {
    width: 100%; height: 100%; object-fit: contain; display: block;
    background: #000; border: 0;
  }
  .caption { padding: 12px 6px 0; display: flex; justify-content: space-between;
    align-items: baseline; gap: 10px; }
  .caption .title { font-weight: 600; }
  .caption .sub { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .caption a { color: var(--accent); font-size: 12.5px; text-decoration: none;
    white-space: nowrap; }
  #empty {
    max-width: 430px; margin: 12vh auto; padding: 0 24px; color: var(--dim);
    text-align: center;
  }
  #empty code { color: var(--text); background: var(--card); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>Mobile renders</h1><span id="meta"></span>
  <div id="chips"></div>
</header>
<main id="feed"></main>
<div id="empty" hidden>
  <p>Nothing to show yet.</p>
  <p>Archive renders load from <code>videos/drive.json</code>; new queue renders
  appear after running <code>site\collect_mobile_renders.ps1</code> on Aurelius.</p>
</div>
<script>
(async function () {
  const feed = document.getElementById('feed');
  const chips = document.getElementById('chips');

  async function getJSON(path) {
    try {
      const r = await fetch(path, { cache: 'no-store' });
      return r.ok ? await r.json() : null;
    } catch (e) { return null; }
  }
  const [manifest, drive] = await Promise.all(
    [getJSON('videos/manifest.json'), getJSON('videos/drive.json')]);

  // sections: [{name, cards: [{kind, ...}]}]
  const sections = [];
  if (manifest && manifest.videos && manifest.videos.length) {
    const vids = manifest.videos.slice().sort(
      (a, b) => (b.finished || '').localeCompare(a.finished || ''));
    sections.push({ name: 'Fresh from the render queue', cards: vids.map(v => ({
      kind: 'local', file: v.file, title: v.name || v.file,
      sub: [v.project, v.res, v.finished && v.finished.slice(0, 10)].filter(Boolean).join(' · '),
    })) });
  }
  if (drive && drive.sections) {
    for (const s of drive.sections) {
      sections.push({ name: s.name, cards: s.entries.map(e => ({
        kind: 'drive', id: e.id, title: e.title,
        sub: [e.year, e.note].filter(Boolean).join(' · '),
      })) });
    }
  }
  if (!sections.length) { document.getElementById('empty').hidden = false; return; }

  const total = sections.reduce((n, s) => n + s.cards.length, 0);
  document.getElementById('meta').textContent = total + ' renders';

  let active = null;
  const allChip = document.createElement('button');
  allChip.className = 'chip on'; allChip.textContent = 'all';
  chips.appendChild(allChip);
  for (const s of sections) {
    const c = document.createElement('button');
    c.className = 'chip'; c.textContent = s.name;
    chips.appendChild(c);
  }
  chips.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    chips.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    c.classList.add('on');
    active = c === allChip ? null : c.textContent;
    render();
  });

  // Lazy-load Drive iframes only when near the viewport, and autoplay/pause
  // local videos by visibility.
  const lazyIO = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.isIntersecting && en.target.dataset.src) {
        en.target.src = en.target.dataset.src;
        delete en.target.dataset.src;
        lazyIO.unobserve(en.target);
      }
    }
  }, { rootMargin: '600px' });
  const playIO = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.intersectionRatio >= 0.6) en.target.play().catch(() => {});
      else en.target.pause();
    }
  }, { threshold: [0, 0.6] });

  function render() {
    feed.textContent = '';
    for (const s of sections) {
      if (active && s.name !== active) continue;
      const h = document.createElement('h2');
      h.className = 'section'; h.textContent = s.name;
      feed.appendChild(h);
      for (const card of s.cards) {
        const el = document.createElement('section');
        el.className = 'shot';
        const frame = document.createElement('div');
        frame.className = 'frame';
        let link = '';
        if (card.kind === 'local') {
          const v = document.createElement('video');
          v.playsInline = true; v.muted = true; v.loop = true;
          v.preload = 'metadata'; v.controls = true;
          v.src = 'videos/' + encodeURIComponent(card.file);
          frame.appendChild(v);
          playIO.observe(v);
        } else {
          const f = document.createElement('iframe');
          f.dataset.src = 'https://drive.google.com/file/d/' + card.id + '/preview';
          f.allow = 'autoplay; fullscreen';
          f.loading = 'lazy';
          frame.appendChild(f);
          lazyIO.observe(f);
          link = 'https://drive.google.com/file/d/' + card.id + '/view';
        }
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.innerHTML = '<div><div class="title"></div><div class="sub"></div></div>' +
          (link ? '<a target="_blank" rel="noopener">Drive ↗</a>' : '');
        cap.querySelector('.title').textContent = card.title;
        cap.querySelector('.sub').textContent = card.sub;
        if (link) cap.querySelector('a').href = link;
        el.appendChild(frame); el.appendChild(cap);
        feed.appendChild(el);
      }
    }
  }
  render();
})();
</script>
</body>
</html>
